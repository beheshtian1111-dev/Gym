<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, Vazirmatn, sans-serif; background:#0f172a; color:#f1f5f9; margin:0; padding:0; }
  .container { max-width:480px; margin:0 auto; padding:16px; min-height:100vh; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 8px; color:#e2e8f0; }
  p { margin:4px 0; }
  input:not([type="checkbox"]), select { width:100%; padding:8px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#fff; margin-top:4px; box-sizing:border-box; font-size:14px; font-family:inherit; }
  input[type="checkbox"] { width:18px; height:18px; flex-shrink:0; accent-color:#22c55e; margin-top:0; }
  label { display:flex; align-items:flex-start; gap:8px; }
  label.field-label { font-size:12px; color:#94a3b8; display:block; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn { padding:12px; border-radius:10px; background:#22c55e; color:#052e16; font-weight:bold; border:none; font-size:15px; cursor:pointer; width:100%; }
  .btn-secondary { background:#38bdf8; color:#052e2e; }
  .btn-outline { background:#1e293b; border:1px solid #334155; color:#e2e8f0; }
  .btn-ghost { background:none; border:none; color:#94a3b8; cursor:pointer; font-size:12px; padding:0; }
  .btn-danger-ghost { background:none; border:none; color:#ef4444; cursor:pointer; font-size:12px; }
  .day-pill { padding:6px 12px; border-radius:20px; font-size:13px; cursor:pointer; border:1px solid #334155; background:#1e293b; color:#e2e8f0; }
  .day-pill.active { border:1px solid #ef4444; background:#ef444422; color:#f87171; }
  .section { margin-bottom:18px; }
  .card { background:#1e293b; border-radius:10px; padding:10px; margin-bottom:8px; }
  .stat { background:#1e293b; border-radius:10px; padding:10px; }
  .stat .label { font-size:11px; color:#94a3b8; }
  .stat .value { font-size:18px; font-weight:bold; }
  .stat .sub { font-size:10px; color:#64748b; }
  .progress-bg { background:#1e293b; border-radius:10px; height:20px; overflow:hidden; margin-bottom:4px; }
  .progress-bg.sm { height:14px; background:#0f172a; }
  .progress-fill { height:100%; background:#22c55e; transition:width .3s; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn { flex:0 0 auto; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid #334155; background:#1e293b; color:#e2e8f0; }
  .tab-btn.active { border:1px solid #22c55e; background:#22c55e22; color:#4ade80; }
  .ex-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #0f172a; }
  .ex-row .ex-name { font-size:13px; }
  .ex-row .ex-meta { font-size:11px; color:#64748b; }
  .checked .ex-name { text-decoration:line-through; color:#64748b; }
  .today-bar { background:linear-gradient(135deg,#16a34a22,#1e293b); border:1px solid #22c55e55; border-radius:12px; padding:12px; margin-bottom:16px; }
  .meal-row, .vit-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #1e293b; font-size:13px; gap:8px; }
  .achv-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .achv { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:10px; text-align:center; }
  .achv.unlocked { background:#22c55e22; border:1px solid #22c55e; }
  .achv .icon { font-size:22px; }
  .achv .t { font-size:12px; font-weight:bold; margin-top:4px; }
  .achv .d { font-size:10px; color:#94a3b8; }
  .logo-wrap { display:flex; justify-content:center; margin-bottom:10px; }
  .center-screen { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; min-height:100vh; }
  .hidden { display:none !important; }
  .measure-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  a.footer-note { color:#64748b; font-size:11px; }
</style>
</head>

function roundNearest5(n){ return Math.round(n/5)*5; }

function calcAnalysis(h,w,age,gender,goal,activity){
  const heightM = h/100;
  const bmi = w/(heightM*heightM);
  let bmr = gender==="مرد" ? 10*w+6.25*h-5*age+5 : 10*w+6.25*h-5*age-161;
  const activityFactors = {"کم":1.2,"متوسط":1.55,"زیاد":1.75};
  let tdee = bmr*(activityFactors[activity]||1.4);
  let calories = tdee;
  if(goal==="کاهش وزن") calories -= 400;
  if(goal==="افزایش حجم") calories += 350;
  const protein = goal==="افزایش حجم" ? w*2.2 : goal==="کاهش وزن" ? w*2 : w*1.6;
  const fat = (calories*0.25)/9;
  const carbs = (calories - protein*4 - fat*9)/4;
  const water = Math.round(w*0.035*10)/10;
  let bmiCategory = "نرمال";
  if(bmi<18.5) bmiCategory="کمبود وزن";
  else if(bmi>=25 && bmi<30) bmiCategory="اضافه وزن";
  else if(bmi>=30) bmiCategory="چاقی";
  const idealMin = 18.5*heightM*heightM;
  const idealMax = 24.9*heightM*heightM;
  const idealMid = (idealMin+idealMax)/2;
  const diff = w - idealMid;
  return { bmi:bmi.toFixed(1), bmiCategory, bmr:Math.round(bmr), tdee:Math.round(tdee),
    calories:roundNearest5(calories), protein:roundNearest5(protein), fat:roundNearest5(fat), carbs:roundNearest5(carbs), water,
    idealMin:Math.round(idealMin), idealMax:Math.round(idealMax), diff:Math.round(Math.abs(diff)),
    needsLoss: diff>1, needsGain: diff<-1 };
}

  {id:"week1",title:"یک هفته کامل",desc:"تمام تمرین‌های هفته",check:s=>s.weekPercent>=100},
  {id:"ten",title:"پایدار",desc:"10 تمرین کامل",check:s=>s.totalDone>=10},
  {id:"twentyfive",title:"حرفه‌ای",desc:"25 تمرین کامل",check:s=>s.totalDone>=25},
  {id:"fifty",title:"قهرمان",desc:"50 تمرین کامل",check:s=>s.totalDone>=50},
];

const MEASURE_FIELDS = [
  {key:"chest",label:"دور سینه"},{key:"waist",label:"دور کمر"},{key:"hips",label:"دور باسن"},
  {key:"thigh",label:"دور ران"},{key:"arm",label:"دور بازو"},{key:"neck",label:"دور گردن"},{key:"calf",label:"دور ساق پا"},
];

// ---------------- STATE ----------------
const STORAGE_KEY = "vesta_fitness_state_v1";
let state = {
  step: "name",
  tab: "workout",
  userName: "",
  form: { height:"", weight:"", age:"", gender:"مرد", goal:"افزایش حجم", activity:"متوسط" },
  restDays: [],
  manualMode: false,
  analysis: null,
  workoutDays: [],
  checklist: {},
  dayCompleted: {},
  totalDone: 0,
  measurements: {},
  showMeasureForm: false,
  meals: [],
  vitamins: [],
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function gymDays(){ return DAYS.filter(d=>!state.restDays.includes(d)); }

function dayProgress(dayObj){
  if(!dayObj || !dayObj.exercises.length) return null;
  const done = dayObj.exercises.filter(e=>state.checklist[dayObj.day+"-"+e.name]).length;
  return Math.round((done/dayObj.exercises.length)*100);
}
function weekPercent(){
  const total = state.workoutDays.reduce((s,d)=>s+d.exercises.length,0);
  if(!total) return 0;
  const done = state.workoutDays.reduce((s,d)=>s+d.exercises.filter(e=>state.checklist[d.day+"-"+e.name]).length,0);
  return Math.round((done/total)*100);
}

// ---------------- RENDER HELPERS ----------------
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function statHtml(label, value, sub, color){
  return `<div class="stat"><p class="label">${label}</p><p class="value" style="${color?`color:${color}`:''}">${value}</p>${sub?`<p class="sub">${sub}</p>`:''}</div>`;
}

function render(){
  saveState();
  const app = document.getElementById('app');
  app.innerHTML = "";
  if(state.step==="name") app.appendChild(renderNameScreen());
  else if(state.step==="form") app.appendChild(renderFormScreen());
  else app.appendChild(renderDashboard());
}

      <div><label class="field-label">سن</label><input id="f_age" type="number" value="${f.age}"/></div>
      <div><label class="field-label">جنسیت</label>
        <select id="f_gender"><option ${f.gender==='مرد'?'selected':''}>مرد</option><option ${f.gender==='زن'?'selected':''}>زن</option></select>
      </div>
    </div>
    <div style="margin-bottom:12px;">
      <label class="field-label">هدف</label>
      <select id="f_goal">
        <option ${f.goal==='افزایش حجم'?'selected':''}>افزایش حجم</option>
        <option ${f.goal==='کاهش وزن'?'selected':''}>کاهش وزن</option>
        <option ${f.goal==='حفظ وزن و تناسب اندام'?'selected':''}>حفظ وزن و تناسب اندام</option>
      </select>
    </div>
    <div style="margin-bottom:12px;">
      <label class="field-label">سطح فعالیت روزانه (خارج از باشگاه)</label>
      <select id="f_activity">
        <option ${f.activity==='کم'?'selected':''}>کم</option>
        <option ${f.activity==='متوسط'?'selected':''}>متوسط</option>
        <option ${f.activity==='زیاد'?'selected':''}>زیاد</option>
      </select>
    </div>
    <p style="font-size:13px;color:#94a3b8;margin:16px 0 8px;">روزهای استراحت (بدون باشگاه):</p>
    <div id="restDaysWrap" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;"></div>
    <p id="gymDaysInfo" style="font-size:12px;color:#64748b;margin-bottom:8px;"></p>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#94a3b8;margin-bottom:16px;cursor:pointer;">
      <input type="checkbox" id="manualModeChk" ${state.manualMode?'checked':''}/>
      می‌خوام برنامه تمرینی خودم رو دستی وارد کنم (به‌جای برنامه پیشنهادی)
    </label>
    <button class="btn" id="planBtn">ساخت برنامه من 🚀</button>
  </div>`);

  const restWrap = wrap.querySelector('#restDaysWrap');
  function refreshRestPills(){
    restWrap.innerHTML = "";
    DAYS.forEach(d=>{
      const active = state.restDays.includes(d);
      const btn = el(`<button class="day-pill ${active?'active':''}">${d}</button>`);
      btn.onclick = ()=>{
        if(state.restDays.includes(d)) state.restDays = state.restDays.filter(x=>x!==d);
        else state.restDays.push(d);
        refreshRestPills();
        wrap.querySelector('#gymDaysInfo').textContent = "روزهای باشگاه: " + (gymDays().length?gymDays().join('، '):'همه روزها');
      };
      restWrap.appendChild(btn);
    });
  }
  refreshRestPills();
  wrap.querySelector('#gymDaysInfo').textContent = "روزهای باشگاه: " + (gymDays().length?gymDays().join('، '):'همه روزها');

  wrap.querySelector('#manualModeChk').onchange = (e)=>{ state.manualMode = e.target.checked; };

  wrap.querySelector('#planBtn').onclick = ()=>{
    const height = wrap.querySelector('#f_height').value;
    const weight = wrap.querySelector('#f_weight').value;
    const age = wrap.querySelector('#f_age').value;
    const gender = wrap.querySelector('#f_gender').value;
    const goal = wrap.querySelector('#f_goal').value;
    const activity = wrap.querySelector('#f_activity').value;
    if(!height||!weight||!age) return;
    state.form = { height, weight, age, gender, goal, activity };
    const a = calcAnalysis(Number(height), Number(weight), Number(age), gender, goal, activity);
    state.analysis = a;
    state.meals = defaultMeals(a.calories, a.protein);
    state.vitamins = DEFAULT_VITAMINS.map(v=>({...v}));
    const gd = gymDays();
    if(!state.manualMode){
      const numGymDays = Math.max(2, Math.min(6, gd.length||3));
      const split = SPLIT_TEMPLATES[numGymDays] || SPLIT_TEMPLATES[3];
      state.workoutDays = gd.map((day,i)=>{
        const tmpl = split[i % split.length];
        return { day, title:tmpl.title, cardio:tmpl.cardio, exercises: tmpl.exercises.map(([name,sets,reps,rest])=>({name,sets,reps,rest})) };
      });
    } else {
      state.workoutDays = gd.map(day=>({day, title:"برنامه دستی", cardio:"", exercises:[]}));
    }
    state.checklist = {};
    state.dayCompleted = {};
    state.totalDone = 0;
    state.step = "dashboard";
    render();
  };

  return wrap;
}

// ---------------- DASHBOARD ----------------
function renderDashboard(){
  const wrap = el(`<div></div>`);
  const today = todayName();
  const todayPlan = state.workoutDays.find(d=>d.day===today) || null;
  const tp = dayProgress(todayPlan);

  wrap.appendChild(el(`<div class="logo-wrap">${LOGO_SVG}</div>`));
  wrap.appendChild(el(`<h1>سلام ${state.userName} 👋</h1>`));
  wrap.appendChild(el(`<p style="font-size:12px;color:#94a3b8;margin-bottom:6px;">خوشحالیم که امروز هم پیشمونی، بریم ادامه بدیم!</p>`));
  const editBtn = el(`<button class="btn-ghost" style="margin-bottom:10px;">← ویرایش اطلاعات</button>`);
  editBtn.onclick = ()=>{ state.step="form"; render(); };
  wrap.appendChild(editBtn);

  const todayBar = el(`<div class="today-bar"></div>`);
  todayBar.innerHTML = `<p style="font-size:12px;color:#86efac;margin-bottom:4px;">امروز — ${today}</p>`;
  if(todayPlan && todayPlan.exercises.length){
    todayBar.innerHTML += `
      <p style="font-weight:bold;font-size:15px;margin-bottom:6px;">${todayPlan.title}</p>
      <div class="progress-bg sm"><div class="progress-fill" style="width:${tp||0}%"></div></div>
      <p style="font-size:12px;color:#94a3b8;">${tp}٪ از تمرین امروز انجام شده (${todayPlan.exercises.length} حرکت)</p>`;
  } else {
    todayBar.innerHTML += `<p style="font-size:14px;color:#94a3b8;">${state.restDays.includes(today) ? 'امروز روز استراحته 😴 حسابی استراحت کن!' : 'برای امروز حرکتی ثبت نشده'}</p>`;
  }
  wrap.appendChild(todayBar);

  const tabs = el(`<div class="tabs"></div>`);
  [["workout","تمرین"],["diet","برنامه غذایی"],["body","بدن و BMI"],["music","موزیک"],["achievements","دستاوردها"]].forEach(([k,l])=>{
    const b = el(`<button class="tab-btn ${state.tab===k?'active':''}">${l}</button>`);
    b.onclick = ()=>{ state.tab=k; render(); };
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  const content = el(`<div></div>`);
  if(state.tab==="workout") content.appendChild(renderWorkoutTab());
  else if(state.tab==="diet") content.appendChild(renderDietTab());
  else if(state.tab==="body") content.appendChild(renderBodyTab());
  else if(state.tab==="music") content.appendChild(renderMusicTab());
  else if(state.tab==="achievements") content.appendChild(renderAchievementsTab());
  wrap.appendChild(content);

  return wrap;
}

function renderWorkoutTab(){
  const wrap = el(`<div></div>`);
  const wp = weekPercent();
  wrap.appendChild(el(`<div class="section">
    <h2>پیشرفت هفتگی</h2>
    <div class="progress-bg"><div class="progress-fill" style="width:${wp}%"></div></div>
    <p style="font-size:13px;color:#94a3b8;">${wp}٪ از تمرینات این هفته انجام شده</p>
  </div>`));

  const planSection = el(`<div class="section"></div>`);
  const planHeader = el(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <h2 style="margin:0;">برنامه تمرینی هفتگی</h2>
  </div>`);
  const collapseAllBtn = el(`<button style="background:none;border:1px solid #334155;border-radius:6px;color:#94a3b8;cursor:pointer;font-size:12px;padding:4px 10px;">بستن همه</button>`);
  collapseAllBtn.onclick = ()=>{
    if(!state.collapsedDays) state.collapsedDays = {};
    const allCollapsed = state.workoutDays.every(d=>state.collapsedDays[d.day]);
    state.workoutDays.forEach(d=>{ state.collapsedDays[d.day] = !allCollapsed; });
    render();
  };
  planHeader.appendChild(collapseAllBtn);
  planSection.appendChild(planHeader);
  if(!state.collapsedDays) state.collapsedDays = {};
  state.workoutDays.forEach(d=>{
    const isDone = state.dayCompleted[d.day];
    const isCollapsed = !!state.collapsedDays[d.day];
    const card = el(`<div class="card" style="${isDone?'border:1px solid #22c55e;':''}"></div>`);
    const header = el(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${isCollapsed?'0':'6px'};gap:8px;">
      <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0;">
        <span style="font-weight:bold;white-space:nowrap;">${d.day} —</span>
        <input class="day-title-input" type="text" value="${d.title}" style="flex:1;min-width:0;width:auto;margin-top:0;padding:4px 6px;font-weight:bold;font-size:14px;" />
      </div>
    </div>`);
    const titleInput = header.querySelector('.day-title-input');
    titleInput.onchange = (e)=>{ d.title = e.target.value.trim() || d.title; saveState(); };

    const toggleBtn = el(`<button style="flex-shrink:0;background:none;border:1px solid #334155;border-radius:6px;color:#94a3b8;cursor:pointer;font-size:13px;padding:2px 8px;">${isCollapsed?'▾ باز کردن':'▴ بستن'}</button>`);
    toggleBtn.onclick = ()=>{
      state.collapsedDays[d.day] = !isCollapsed;
      render();
    };
    header.appendChild(toggleBtn);

    const delBtn = el(`<button class="btn-danger-ghost" style="flex-shrink:0;">حذف روز</button>`);
    delBtn.onclick = ()=>{ state.workoutDays = state.workoutDays.filter(x=>x.day!==d.day); render(); };
    header.appendChild(delBtn);
    card.appendChild(header);

    if(!isCollapsed){
    d.exercises.forEach(ex=>{
      const checked = !!state.checklist[d.day+"-"+ex.name];
      const row = el(`<div class="ex-row ${checked?'checked':''}"></div>`);
      const cb = el(`<input type="checkbox" ${checked?'checked':''}/>`);
      cb.onchange = ()=>{
        const key = d.day+"-"+ex.name;
        const was = !!state.checklist[key];
        state.checklist[key] = !was;
        state.totalDone = Math.max(0, state.totalDone + (was?-1:1));
        render();
      };
      row.appendChild(cb);
      const info = el(`<div style="flex:1;">
        <p class="ex-name">${ex.name}</p>
        ${ex.sets!=="-" ? `<p class="ex-meta">${ex.sets} ست × ${ex.reps} تکرار — استراحت ${ex.rest} ثانیه</p>` : ''}
      </div>`);
      row.appendChild(info);
      if(state.manualMode){
        const rm = el(`<button class="btn-danger-ghost">حذف</button>`);
        rm.onclick = ()=>{ d.exercises = d.exercises.filter(e=>e.name!==ex.name); render(); };
        row.appendChild(rm);
      }
      card.appendChild(row);
    });

    if(d.cardio) card.appendChild(el(`<p style="font-size:12px;color:#38bdf8;margin:6px 0;">🏃 هوازی: ${d.cardio}</p>`));

    if(d.exercises.length>0){
      const completeBtn = el(`<button class="btn" style="margin-top:8px;font-size:13px;${isDone?'background:#22c55e33;color:#4ade80;':''}" ${isDone?'disabled':''}>${isDone?'✔ این روز کامل شد، آفرین!':'ثبت پایان تمرین امروز ✅'}</button>`);
      if(!isDone){
        completeBtn.onclick = ()=>{
          let added=0;
          d.exercises.forEach(ex=>{
            const key=d.day+"-"+ex.name;
            if(!state.checklist[key]){ state.checklist[key]=true; added++; }
          });
          state.totalDone += added;
          state.dayCompleted[d.day] = true;
          render();
        };
      }
      card.appendChild(completeBtn);
    }
    } // end if(!isCollapsed)
    planSection.appendChild(card);
  });
  state.restDays.forEach(d=>{
    planSection.appendChild(el(`<div class="card" style="opacity:.6;"><p style="font-size:13px;margin:0;">${d} — روز استراحت 😴</p></div>`));
  });
  wrap.appendChild(planSection);

  const manualSection = el(`<div class="section"><h2>افزودن برنامه دستی</h2></div>`);
  const manualCard = el(`<div class="card">
    <div style="margin-bottom:8px;">
      <label class="field-label">روز</label>
      <select id="man_day">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select>
    </div>
    <div><label class="field-label">عنوان روز (اختیاری)</label><input id="man_title" type="text"/></div>
    <div style="margin-top:8px;"><label class="field-label">نام حرکت</label><input id="man_ex" type="text"/></div>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;">
      <div><label class="field-label">تعداد ست</label><input id="man_sets" type="number"/></div>
      <div><label class="field-label">تعداد تکرار</label><input id="man_reps" type="text"/></div>
      <div><label class="field-label">استراحت (ثانیه)</label><input id="man_rest" type="number"/></div>
    </div>
    <button class="btn btn-secondary" style="margin-top:10px;">افزودن حرکت</button>
  </div>`);
  manualCard.querySelector('button').onclick = ()=>{
    const day = manualCard.querySelector('#man_day').value;
    const title = manualCard.querySelector('#man_title').value;
    const name = manualCard.querySelector('#man_ex').value.trim();
    const sets = manualCard.querySelector('#man_sets').value || "-";
    const reps = manualCard.querySelector('#man_reps').value || "-";
    const rest = manualCard.querySelector('#man_rest').value || "-";
    if(!name) return;
    let dObj = state.workoutDays.find(x=>x.day===day);
    if(!dObj){ dObj = { day, title: title||"برنامه دستی", cardio:"", exercises:[] }; state.workoutDays.push(dObj); }
    dObj.exercises.push({ name, sets, reps, rest });
    render();
  };
  manualSection.appendChild(manualCard);
  wrap.appendChild(manualSection);

  return wrap;
}

      ${statHtml("کربوهیدرات", a.carbs+" گ", null, "#60a5fa")}

  wrap.appendChild(el(`<div class="section"><h2>آب پیشنهادی</h2>${statHtml("آب روزانه", a.water+" لیتر", null, "#38bdf8")}</div>`));

    const row = el(`<div class="vit-row">
      <div><p style="font-weight:bold;margin:0;">${v.name} <span style="color:#94a3b8;font-weight:normal;">— ${v.dose}</span></p>
      ${v.note?`<p style="color:#64748b;font-size:12px;margin:0;">${v.note}</p>`:''}</div>
    </div>`);
    const rm = el(`<button class="btn-danger-ghost">حذف</button>`);
    rm.onclick = ()=>{ state.vitamins = state.vitamins.filter(x=>x.id!==v.id); render(); };
    row.appendChild(rm);
    vitSection.appendChild(row);
  });
  const addVitCard = el(`<div class="card" style="margin-top:10px;">
    <label class="field-label">نام مکمل/ویتامین</label><input id="vit_name" type="text"/>
    <div style="margin-top:8px;"><label class="field-label">دوز مصرفی</label><input id="vit_dose" type="text"/></div>
    <button class="btn btn-secondary" style="margin-top:10px;">افزودن مکمل</button>

  addVitCard.querySelector('button').onclick = ()=>{
    const name = addVitCard.querySelector('#vit_name').value.trim();
    const dose = addVitCard.querySelector('#vit_dose').value.trim();
    if(!name) return;
    state.vitamins.push({ id:"v"+Date.now(), name, dose: dose||"-", note:"" });
    render();
  };
  vitSection.appendChild(addVitCard);
  vitSection.appendChild(el(`<p class="footer-note" style="margin-top:8px;">* قبل از مصرف هر مکملی با پزشک یا متخصص تغذیه مشورت کن.</p>`));
  wrap.appendChild(vitSection);

  return wrap;
}

      ${statHtml("BMI", a.bmi, a.bmiCategory)}
      ${statHtml("متابولیسم پایه", a.bmr, "کالری")}

      ${statHtml("کالری هدف", a.calories, "کالری", "#22c55e")}

  </div>`));

  if(a.needsLoss) idealExtra = statHtml("نیاز به کاهش وزن", a.diff+" کیلوگرم", "برای رسیدن به وزن ایده‌آل", "#f87171");

  else idealExtra = statHtml("وضعیت وزن", "عالیه!", "در محدوده ایده‌آل هستی", "#22c55e");

  wrap.appendChild(el(`<div class="section">
    <h2>وزن ایده‌آل</h2>
    <div class="grid2">
      ${statHtml("محدوده وزن ایده‌آل", a.idealMin+" - "+a.idealMax+" کیلوگرم")}

    </div>

  const measureSection = el(`<div class="section"><h2>اندازه‌گیری بدن (اختیاری)</h2></div>`);
  if(!state.showMeasureForm){
    const showBtn = el(`<button class="btn btn-outline">+ ثبت دور بدن (سینه، ران، باسن، بازو، ...)</button>`);

  } else {
    const mGrid = el(`<div class="card"><div class="measure-grid"></div></div>`);
    const grid = mGrid.querySelector('.measure-grid');
    MEASURE_FIELDS.forEach(f=>{
      const fieldWrap = el(`<div><label class="field-label">${f.label} (سانتی‌متر)</label><input type="number" value="${state.measurements[f.key]||''}"/></div>`);
      fieldWrap.querySelector('input').oninput = (e)=>{ state.measurements[f.key] = e.target.value; saveState(); };
      grid.appendChild(fieldWrap);

  }
  wrap.appendChild(measureSection);

  return wrap;
}

// ---------------- MUSIC (IndexedDB) ----------------
const MUSIC_DB_NAME = "vesta_fitness_music";
const MUSIC_STORE = "tracks";
let musicDB = null;
let currentAudio = null;
let currentTrackId = null;
let isPlaying = false;

function openMusicDB(){
  return new Promise((resolve, reject)=>{
    if(musicDB) return resolve(musicDB);
    try{
      const req = indexedDB.open(MUSIC_DB_NAME, 1);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(MUSIC_STORE)){
          db.createObjectStore(MUSIC_STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = (e)=>{ musicDB = e.target.result; resolve(musicDB); };
      req.onerror = (e)=>{ reject(e.target.error || e); };
      req.onblocked = ()=>{ reject(new Error("database blocked")); };
    }catch(err){
      reject(err);
    }
  });
}
function addTrack(file){
  return openMusicDB().then(db=>new Promise((resolve,reject)=>{
    const id = "t"+Date.now()+Math.random().toString(36).slice(2);
    const tx = db.transaction(MUSIC_STORE, "readwrite");
    tx.objectStore(MUSIC_STORE).put({ id, name: file.name, blob: file });
    tx.oncomplete = ()=>resolve(id);
    tx.onerror = (e)=>reject(e);
  }));
}
function getAllTracks(){
  return openMusicDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(MUSIC_STORE, "readonly");
    const req = tx.objectStore(MUSIC_STORE).getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = (e)=>reject(e);
  }));
}
function deleteTrack(id){
  return openMusicDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(MUSIC_STORE, "readwrite");
    tx.objectStore(MUSIC_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = (e)=>reject(e);
  }));
}

function renderMusicTab(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="section">
    <h2>🎵 موزیک‌های باشگاه</h2>
    <p style="font-size:12px;color:#94a3b8;margin-bottom:10px;">فایل‌های موزیک گوشیت رو اضافه کن، همیشه توی همین مرورگر ذخیره می‌مونن و لازم نیست دوباره وارد کنی.</p>
  </div>`));

  const uploadCard = el(`<div class="card">
    <input type="file" id="musicFileInput" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac,.wma,.opus,.caf" multiple style="width:100%;color:#94a3b8;"/>
    <p style="font-size:11px;color:#64748b;margin-top:8px;">اگه فایل صوتیت توی لیست بالا دیده نشد (به‌خاطر فرمت خاص)، از این گزینه استفاده کن:</p>
    <input type="file" id="musicFileInputAny" accept="*/*" multiple style="width:100%;color:#94a3b8;margin-top:4px;"/>
    <p id="uploadStatus" style="font-size:12px;color:#94a3b8;margin-top:8px;"></p>
  </div>`);
  wrap.appendChild(uploadCard);

  const listSection = el(`<div class="section" id="musicListSection"><h2>پلی‌لیست</h2></div>`);
  wrap.appendChild(listSection);

  const playerCard = el(`<div class="card" id="playerCard" style="display:none;position:sticky;bottom:8px;"></div>`);
  wrap.appendChild(playerCard);

  function refreshList(){
    getAllTracks().then(tracks=>{
      const existingList = listSection.querySelector('.music-list');
      if(existingList) existingList.remove();
      const listWrap = el(`<div class="music-list"></div>`);
      if(!tracks.length){
        listWrap.appendChild(el(`<p style="font-size:13px;color:#64748b;">هنوز موزیکی اضافه نکردی.</p>`));
      }
      tracks.forEach(t=>{
        const row = el(`<div class="meal-row"></div>`);
        const isCurrentPlaying = currentTrackId===t.id && isPlaying;
        const playBtn = el(`<button style="background:none;border:none;color:${isCurrentPlaying?'#22c55e':'#e2e8f0'};cursor:pointer;font-size:16px;">${isCurrentPlaying?'⏸':'▶️'}</button>`);
        playBtn.onclick = ()=> playTrack(t);
        row.appendChild(playBtn);
        row.appendChild(el(`<span style="flex:1;text-align:right;font-size:13px;">${t.name}</span>`));
        const rm = el(`<button class="btn-danger-ghost">حذف</button>`);
        rm.onclick = ()=>{
          if(currentTrackId===t.id && currentAudio){ currentAudio.pause(); currentAudio=null; currentTrackId=null; isPlaying=false; playerCard.style.display="none"; }
          deleteTrack(t.id).then(refreshList);
        };
        row.appendChild(rm);
        listWrap.appendChild(row);
      });
      listSection.appendChild(listWrap);
    });
  }

  function playTrack(t){
    if(currentTrackId===t.id && currentAudio){
      if(isPlaying){ currentAudio.pause(); isPlaying=false; }
      else { currentAudio.play(); isPlaying=true; }
      refreshList(); updatePlayerBar(t);
      return;
    }
    if(currentAudio){ currentAudio.pause(); }
    const url = URL.createObjectURL(t.blob);
    currentAudio = new Audio(url);
    currentTrackId = t.id;
    currentAudio.play();
    isPlaying = true;
    currentAudio.onended = ()=>{ isPlaying=false; refreshList(); updatePlayerBar(t); };
    refreshList();
    updatePlayerBar(t);
  }

  function updatePlayerBar(t){
    playerCard.style.display = "block";
    playerCard.innerHTML = "";
    playerCard.appendChild(el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-size:13px;">🎧 در حال پخش: ${t.name}</span>
    </div>`));
    const btnRow = el(`<div style="display:flex;gap:8px;margin-top:8px;"></div>`);
    const toggleBtn = el(`<button class="btn btn-secondary" style="font-size:13px;">${isPlaying?'⏸ توقف':'▶️ پخش'}</button>`);
    toggleBtn.onclick = ()=>{
      if(isPlaying){ currentAudio.pause(); isPlaying=false; } else { currentAudio.play(); isPlaying=true; }
      refreshList(); updatePlayerBar(t);
    };
    btnRow.appendChild(toggleBtn);
    playerCard.appendChild(btnRow);
  }

  function handleFileSelect(e){
    const statusEl = uploadCard.querySelector('#uploadStatus');
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    if(!window.indexedDB){
      statusEl.textContent = "❌ مرورگرت از ذخیره‌سازی موزیک پشتیبانی نمی‌کنه (حالت خصوصی/Private رو خاموش کن).";
      statusEl.style.color = "#f87171";
      return;
    }
    statusEl.style.color = "#94a3b8";
    statusEl.textContent = `⏳ در حال افزودن ${files.length} فایل...`;

    // Pre-check: zero-byte files usually mean the file is still only on iCloud
    // and hasn't finished downloading to the device yet.
    const zeroByteNames = files.filter(f=>f.size===0).map(f=>f.name);

    const tasks = files.map(f=>
      addTrack(f)
        .then(()=>({ name: f.name, ok: true }))
        .catch(err=>({ name: f.name, ok: false, error: (err && (err.message || err.name)) || String(err) }))
    );

    Promise.all(tasks).then((results)=>{
      const okResults = results.filter(r=>r.ok);
      const failResults = results.filter(r=>!r.ok);
      let msg = "";
      let color = "#4ade80";
      if(okResults.length){
        msg += `✅ ${okResults.length} فایل اضافه شد. `;
      }
      if(failResults.length){
        color = okResults.length ? "#fbbf24" : "#f87171";
        msg += `❌ ${failResults.length} فایل ناموفق: ` + failResults.map(r=>`${r.name} (${r.error})`).join(" | ");
      }
      if(zeroByteNames.length){
        color = "#f87171";
        msg += (msg?" — ":"") + `⚠️ این فایل(ها) حجمشون صفره، یعنی هنوز کامل از آیکلاد دانلود نشدن: ${zeroByteNames.join(", ")}. اول توی اپ Files روشون بزن تا آیکون ابری دانلود بشه (علامت ✔ بیاد)، بعد دوباره اینجا انتخابشون کن.`;
      }
      statusEl.textContent = msg || "چیزی برای افزودن پیدا نشد.";
      statusEl.style.color = color;
      refreshList();
      e.target.value = "";
    }).catch(err=>{
      console.error(err);
      statusEl.textContent = "❌ خطای غیرمنتظره: " + ((err && (err.message||err.name)) || String(err));
      statusEl.style.color = "#f87171";
    });
  }
  uploadCard.querySelector('#musicFileInput').onchange = handleFileSelect;
  uploadCard.querySelector('#musicFileInputAny').onchange = handleFileSelect;

  refreshList();
  if(currentTrackId && currentAudio){
    getAllTracks().then(tracks=>{
      const t = tracks.find(x=>x.id===currentTrackId);
      if(t) updatePlayerBar(t);
    });
  }

  return wrap;
}

function renderAchievementsTab(){
  const wp = weekPercent();
  const unlocked = ACHIEVEMENT_DEFS.filter(a=>a.check({ totalDone: state.totalDone, weekPercent: wp }));
  const wrap = el(`<div class="section"><h2>دستاوردها (Achievements)</h2><div class="achv-grid"></div></div>`);
  const grid = wrap.querySelector('.achv-grid');
  ACHIEVEMENT_DEFS.forEach(a=>{
    const isUnlocked = unlocked.includes(a);
    grid.appendChild(el(`<div class="achv ${isUnlocked?'unlocked':''}">
      <div class="icon">${isUnlocked?'🏆':'🔒'}</div>
      <p class="t">${a.title}</p>
      <p class="d">${a.desc}</p>
    </div>`));
  });
  return wrap;
}
