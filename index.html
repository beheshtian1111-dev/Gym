<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, Vazirmatn, sans-serif; background:#0f172a; color:#f1f5f9; margin:0; padding:0; }
  .container { max-width:480px; margin:0 auto; padding:16px; min-height:100vh; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 8px; color:#e2e8f0; }
  p { margin:4px 0; }
  input:not([type="checkbox"]), select { width:100%; padding:8px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#fff; margin-top:4px; box-sizing:border-box; font-size:14px; font-family:inherit; }
  input[type="checkbox"] { width:18px; height:18px; flex-shrink:0; accent-color:#22c55e; margin-top:0; }
  label { display:flex; align-items:flex-start; gap:8px; }
  label.field-label { font-size:12px; color:#94a3b8; display:block; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn { padding:12px; border-radius:10px; background:#22c55e; color:#052e16; font-weight:bold; border:none; font-size:15px; cursor:pointer; width:100%; }
  .btn-secondary { background:#38bdf8; color:#052e2e; }
  .btn-outline { background:#1e293b; border:1px solid #334155; color:#e2e8f0; }
  .btn-ghost { background:none; border:none; color:#94a3b8; cursor:pointer; font-size:12px; padding:0; }
  .btn-danger-ghost { background:none; border:none; color:#ef4444; cursor:pointer; font-size:12px; }
  .day-pill { padding:6px 12px; border-radius:20px; font-size:13px; cursor:pointer; border:1px solid #334155; background:#1e293b; color:#e2e8f0; }
  .day-pill.active { border:1px solid #ef4444; background:#ef444422; color:#f87171; }
  .section { margin-bottom:18px; }
  .card { background:#1e293b; border-radius:10px; padding:10px; margin-bottom:8px; }
  .stat { background:#1e293b; border-radius:10px; padding:10px; }
  .stat .label { font-size:11px; color:#94a3b8; }
  .stat .value { font-size:18px; font-weight:bold; }
  .stat .sub { font-size:10px; color:#64748b; }
  .progress-bg { background:#1e293b; border-radius:10px; height:20px; overflow:hidden; margin-bottom:4px; }
  .progress-bg.sm { height:14px; background:#0f172a; }
  .progress-fill { height:100%; background:#22c55e; transition:width .3s; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tab-btn { flex:0 0 auto; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid #334155; background:#1e293b; color:#e2e8f0; }
  .tab-btn.active { border:1px solid #22c55e; background:#22c55e22; color:#4ade80; }
  .ex-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #0f172a; }
  .ex-row .ex-name { font-size:13px; }
  .ex-row .ex-meta { font-size:11px; color:#64748b; }
  .checked .ex-name { text-decoration:line-through; color:#64748b; }
  .today-bar { background:linear-gradient(135deg,#16a34a22,#1e293b); border:1px solid #22c55e55; border-radius:12px; padding:12px; margin-bottom:16px; }
  .meal-row, .vit-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #1e293b; font-size:13px; gap:8px; }
  .achv-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .achv { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:10px; text-align:center; }
  .achv.unlocked { background:#22c55e22; border:1px solid #22c55e; }
  .achv .icon { font-size:22px; }
  .achv .t { font-size:12px; font-weight:bold; margin-top:4px; }
  .achv .d { font-size:10px; color:#94a3b8; }
  .logo-wrap { display:flex; justify-content:center; margin-bottom:10px; }
  .center-screen { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; min-height:100vh; }
  .hidden { display:none !important; }
  .measure-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  a.footer-note { color:#64748b; font-size:11px; }
</style>
</head>

function roundNearest5(n){ return Math.round(n/5)*5; }

function calcAnalysis(h,w,age,gender,goal,activity){
  const heightM = h/100;
  const bmi = w/(heightM*heightM);
  let bmr = gender==="مرد" ? 10*w+6.25*h-5*age+5 : 10*w+6.25*h-5*age-161;
  const activityFactors = {"کم":1.2,"متوسط":1.55,"زیاد":1.75};
  let tdee = bmr*(activityFactors[activity]||1.4);
  let calories = tdee;
  if(goal==="کاهش وزن") calories -= 400;
  if(goal==="افزایش حجم") calories += 350;
  const protein = goal==="افزایش حجم" ? w*2.2 : goal==="کاهش وزن" ? w*2 : w*1.6;
  const fat = (calories*0.25)/9;
  const carbs = (calories - protein*4 - fat*9)/4;
  const water = Math.round(w*0.035*10)/10;
  let bmiCategory = "نرمال";
  if(bmi<18.5) bmiCategory="کمبود وزن";
  else if(bmi>=25 && bmi<30) bmiCategory="اضافه وزن";
  else if(bmi>=30) bmiCategory="چاقی";
  const idealMin = 18.5*heightM*heightM;
  const idealMax = 24.9*heightM*heightM;
  const idealMid = (idealMin+idealMax)/2;
  const diff = w - idealMid;
  return { bmi:bmi.toFixed(1), bmiCategory, bmr:Math.round(bmr), tdee:Math.round(tdee),
    calories:roundNearest5(calories), protein:roundNearest5(protein), fat:roundNearest5(fat), carbs:roundNearest5(carbs), water,
    idealMin:Math.round(idealMin), idealMax:Math.round(idealMax), diff:Math.round(Math.abs(diff)),
    needsLoss: diff>1, needsGain: diff<-1 };
}

const STORAGE_KEY = "vesta_fitness_state_v1";
let state = {
  step: "name",
  tab: "workout",
  userName: "",
  form: { height:"", weight:"", age:"", gender:"مرد", goal:"افزایش حجم", activity:"متوسط" },
  restDays: [],
  manualMode: false,
  analysis: null,
  workoutDays: [],
  checklist: {},
  dayCompleted: {},
  totalDone: 0,
  measurements: {},
  showMeasureForm: false,
  meals: [],
  vitamins: [],
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function gymDays(){ return DAYS.filter(d=>!state.restDays.includes(d)); }

function dayProgress(dayObj){
  if(!dayObj || !dayObj.exercises.length) return null;
  const done = dayObj.exercises.filter(e=>state.checklist[dayObj.day+"-"+e.name]).length;
  return Math.round((done/dayObj.exercises.length)*100);
}
function weekPercent(){
  const total = state.workoutDays.reduce((s,d)=>s+d.exercises.length,0);
  if(!total) return 0;
  const done = state.workoutDays.reduce((s,d)=>s+d.exercises.filter(e=>state.checklist[d.day+"-"+e.name]).length,0);
  return Math.round((done/total)*100);
}

          d.exercises.forEach(ex=>{
            const key=d.day+"-"+ex.name;
            if(!state.checklist[key]){ state.checklist[key]=true; added++; }
          });
          state.totalDone += added;
          state.dayCompleted[d.day] = true;
          render();
        };
      }
      card.appendChild(completeBtn);
    }
    planSection.appendChild(card);
  });
  state.restDays.forEach(d=>{
    planSection.appendChild(el(`<div class="card" style="opacity:.6;"><p style="font-size:13px;margin:0;">${d} — روز استراحت 😴</p></div>`));
  });
  wrap.appendChild(planSection);

  const manualSection = el(`<div class="section"><h2>افزودن برنامه دستی</h2></div>`);
  const manualCard = el(`<div class="card">
    <div style="margin-bottom:8px;">
      <label class="field-label">روز</label>
      <select id="man_day">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select>
    </div>
    <div><label class="field-label">عنوان روز (اختیاری)</label><input id="man_title" type="text"/></div>
    <div style="margin-top:8px;"><label class="field-label">نام حرکت</label><input id="man_ex" type="text"/></div>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;">
      <div><label class="field-label">تعداد ست</label><input id="man_sets" type="number"/></div>
      <div><label class="field-label">تعداد تکرار</label><input id="man_reps" type="text"/></div>
      <div><label class="field-label">استراحت (ثانیه)</label><input id="man_rest" type="number"/></div>
    </div>
    <button class="btn btn-secondary" style="margin-top:10px;">افزودن حرکت</button>
  </div>`);
  manualCard.querySelector('button').onclick = ()=>{
    const day = manualCard.querySelector('#man_day').value;
    const title = manualCard.querySelector('#man_title').value;
    const name = manualCard.querySelector('#man_ex').value.trim();
    const sets = manualCard.querySelector('#man_sets').value || "-";
    const reps = manualCard.querySelector('#man_reps').value || "-";
    const rest = manualCard.querySelector('#man_rest').value || "-";
    if(!name) return;
    let dObj = state.workoutDays.find(x=>x.day===day);
    if(!dObj){ dObj = { day, title: title||"برنامه دستی", cardio:"", exercises:[] }; state.workoutDays.push(dObj); }
    dObj.exercises.push({ name, sets, reps, rest });
    render();
  };
  manualSection.appendChild(manualCard);
  wrap.appendChild(manualSection);

  return wrap;
}

function renderDietTab(){
  const a = state.analysis;
  const wrap = el(`<div></div>`);
  if(!a) return wrap;

  wrap.appendChild(el(`<div class="section">
    <h2>ماکروهای روزانه</h2>
    <div class="grid2">
      ${statHtml("کالری هدف", a.calories, "کالری", "#22c55e")}
      ${statHtml("پروتئین", a.protein+" گ", null, "#f87171")}
      ${statHtml("کربوهیدرات", a.carbs+" گ", null, "#60a5fa")}
      ${statHtml("چربی", a.fat+" گ", null, "#fbbf24")}
    </div>
  </div>`));

  wrap.appendChild(el(`<div class="section"><h2>آب پیشنهادی</h2>${statHtml("آب روزانه", a.water+" لیتر", null, "#38bdf8")}</div>`));

  const mealSection = el(`<div class="section"><h2>برنامه غذایی پیشنهادی</h2></div>`);
  state.meals.forEach(m=>{
    const row = el(`<div class="meal-row">
      <span style="color:#94a3b8;min-width:90px;">${m.meal}</span>
      <span style="text-align:left;flex:1;">${m.desc}</span>
    </div>`);
    const rm = el(`<button class="btn-danger-ghost">حذف</button>`);
    rm.onclick = ()=>{ state.meals = state.meals.filter(x=>x.id!==m.id); render(); };
    row.appendChild(rm);
    mealSection.appendChild(row);
  });
  const addMealCard = el(`<div class="card" style="margin-top:10px;">
    <label class="field-label">نام وعده (مثلاً میان‌وعده عصر)</label><input id="meal_name" type="text"/>
    <div style="margin-top:8px;"><label class="field-label">توضیحات</label><input id="meal_desc" type="text"/></div>
    <button class="btn btn-secondary" style="margin-top:10px;">افزودن وعده غذایی</button>
  </div>`);
  addMealCard.querySelector('button').onclick = ()=>{
    const name = addMealCard.querySelector('#meal_name').value.trim();
    const desc = addMealCard.querySelector('#meal_desc').value.trim();
    if(!name) return;
    state.meals.push({ id:"m"+Date.now(), meal:name, desc: desc||"-" });
    render();
  };
  mealSection.appendChild(addMealCard);
  wrap.appendChild(mealSection);

  const vitSection = el(`<div class="section"><h2>مکمل و ویتامین پیشنهادی</h2></div>`);
  state.vitamins.forEach(v=>{
    const row = el(`<div class="vit-row">
      <div><p style="font-weight:bold;margin:0;">${v.name} <span style="color:#94a3b8;font-weight:normal;">— ${v.dose}</span></p>
      ${v.note?`<p style="color:#64748b;font-size:12px;margin:0;">${v.note}</p>`:''}</div>
    </div>`);
    const rm = el(`<button class="btn-danger-ghost">حذف</button>`);
    rm.onclick = ()=>{ state.vitamins = state.vitamins.filter(x=>x.id!==v.id); render(); };
    row.appendChild(rm);
    vitSection.appendChild(row);
  });
  const addVitCard = el(`<div class="card" style="margin-top:10px;">
    <label class="field-label">نام مکمل/ویتامین</label><input id="vit_name" type="text"/>
    <div style="margin-top:8px;"><label class="field-label">دوز مصرفی</label><input id="vit_dose" type="text"/></div>
    <button class="btn btn-secondary" style="margin-top:10px;">افزودن مکمل</button>
  </div>`);
  addVitCard.querySelector('button').onclick = ()=>{
    const name = addVitCard.querySelector('#vit_name').value.trim();
    const dose = addVitCard.querySelector('#vit_dose').value.trim();
    if(!name) return;
    state.vitamins.push({ id:"v"+Date.now(), name, dose: dose||"-", note:"" });
    render();
  };
  vitSection.appendChild(addVitCard);
  vitSection.appendChild(el(`<p class="footer-note" style="margin-top:8px;">* قبل از مصرف هر مکملی با پزشک یا متخصص تغذیه مشورت کن.</p>`));
  wrap.appendChild(vitSection);

  return wrap;
}

function renderBodyTab(){
  const a = state.analysis;
  const wrap = el(`<div></div>`);
  if(!a) return wrap;

  wrap.appendChild(el(`<div class="section">
    <h2>آنالیز بدن</h2>
    <div class="grid2">
      ${statHtml("BMI", a.bmi, a.bmiCategory)}
      ${statHtml("متابولیسم پایه", a.bmr, "کالری")}
      ${statHtml("نیاز روزانه", a.tdee, "کالری")}
      ${statHtml("کالری هدف", a.calories, "کالری", "#22c55e")}
    </div>
  </div>`));

  let idealExtra = "";
  if(a.needsLoss) idealExtra = statHtml("نیاز به کاهش وزن", a.diff+" کیلوگرم", "برای رسیدن به وزن ایده‌آل", "#f87171");
  else if(a.needsGain) idealExtra = statHtml("نیاز به افزایش وزن", a.diff+" کیلوگرم", "برای رسیدن به وزن ایده‌آل", "#60a5fa");
  else idealExtra = statHtml("وضعیت وزن", "عالیه!", "در محدوده ایده‌آل هستی", "#22c55e");

  wrap.appendChild(el(`<div class="section">
    <h2>وزن ایده‌آل</h2>
    <div class="grid2">
      ${statHtml("محدوده وزن ایده‌آل", a.idealMin+" - "+a.idealMax+" کیلوگرم")}
      ${idealExtra}
    </div>
  </div>`));

  const measureSection = el(`<div class="section"><h2>اندازه‌گیری بدن (اختیاری)</h2></div>`);
  if(!state.showMeasureForm){
    const showBtn = el(`<button class="btn btn-outline">+ ثبت دور بدن (سینه، ران، باسن، بازو، ...)</button>`);
    showBtn.onclick = ()=>{ state.showMeasureForm = true; render(); };
    measureSection.appendChild(showBtn);
  } else {
    const mGrid = el(`<div class="card"><div class="measure-grid"></div></div>`);
    const grid = mGrid.querySelector('.measure-grid');
    MEASURE_FIELDS.forEach(f=>{
      const fieldWrap = el(`<div><label class="field-label">${f.label} (سانتی‌متر)</label><input type="number" value="${state.measurements[f.key]||''}"/></div>`);
      fieldWrap.querySelector('input').oninput = (e)=>{ state.measurements[f.key] = e.target.value; saveState(); };
      grid.appendChild(fieldWrap);
    });
    measureSection.appendChild(mGrid);
  }
  if(Object.values(state.measurements).some(v=>v)){
    const resultGrid = el(`<div class="grid2" style="margin-top:10px;"></div>`);
    MEASURE_FIELDS.filter(f=>state.measurements[f.key]).forEach(f=>{
      resultGrid.appendChild(el(statHtml(f.label, state.measurements[f.key]+" سانتی‌متر")));
    });
    measureSection.appendChild(resultGrid);
  }
  wrap.appendChild(measureSection);

  return wrap;
}

function renderAchievementsTab(){
  const wp = weekPercent();
  const unlocked = ACHIEVEMENT_DEFS.filter(a=>a.check({ totalDone: state.totalDone, weekPercent: wp }));
  const wrap = el(`<div class="section"><h2>دستاوردها (Achievements)</h2><div class="achv-grid"></div></div>`);
  const grid = wrap.querySelector('.achv-grid');
  ACHIEVEMENT_DEFS.forEach(a=>{
    const isUnlocked = unlocked.includes(a);
    grid.appendChild(el(`<div class="achv ${isUnlocked?'unlocked':''}">
      <div class="icon">${isUnlocked?'🏆':'🔒'}</div>
      <p class="t">${a.title}</p>
      <p class="d">${a.desc}</p>
    </div>`));
  });
  return wrap;
}

loadState();
render();
</script>
